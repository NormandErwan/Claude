# Temporary probe: does a github-actions[bot] comment reach a Claude session
# subscribed to this PR? Removed once answered.
name: probe-bot-comment
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  pull-requests: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "probe: bot comment at $(date -u +%H:%M:%S)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
