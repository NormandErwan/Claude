name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Shell syntax
        # bash -n checks only its first file arg: loop
        run: for f in .claude/hooks/*.sh templates/hooks/*.sh; do bash -n "$f" || exit 1; done
      - name: SKILLS.md matches skills/ and skills.txt
        run: bash .claude/hooks/check-skills.sh --check
      - name: check-skills.sh regression tests
        run: bash .claude/hooks/test-check-skills.sh -v
